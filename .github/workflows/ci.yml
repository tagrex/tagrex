name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, so CI can be re-run on the current HEAD when a hosted runner
  # fails to pick up the push-triggered job (a GitHub-side runner hiccup) without
  # needing an empty commit.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The `app` crate is a Tauri 2 desktop shell; on Linux it links against
      # GTK/WebKit/glib system libraries, which the runner doesn't ship.
      # `libasound2-dev` (ALSA) is needed by the rodio audio backend used for
      # the preview player. `dbus` brings `dbus-run-session` for the media
      # session's D-Bus tests below.
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            patchelf \
            dbus

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # A standalone ES-module regression, with no npm install or frontend build.
      - name: Check field-lock submission order
        run: node --experimental-vm-modules --test tests/unit/field-lock-order.test.js

      # The Linux media session (#516) exports MPRIS on the session bus; its
      # tests are ignored by default because a plain `cargo test` has no bus.
      # dbus-run-session gives this step a private one.
      - name: Test the media session on a private D-Bus
        run: dbus-run-session -- cargo test -p tagrex mpris -- --ignored

  # A second job that only compiles, on Windows (#223). A dependency can be
  # wrong for that platform alone — a feature flag it needs, a `cfg(windows)`
  # block that stopped building — while this workflow stays green, and until
  # this job existed the first sign of it was the release workflow failing on a
  # tag, which is after the release is published. Deliberately not a bundle
  # build: the release workflow packages the installers, this only has to prove
  # the code compiles.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # The same on macOS (#704), for the same reason: code behind `cfg(target_os)`
  # and a dependency's platform features are otherwise first built on a release
  # tag. It is also the one job on APFS, which treats the NFC and NFD spellings
  # of a name as one file.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
