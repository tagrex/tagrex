name: Release build

# Builds the desktop app on native runners per OS, because cross-compiling Tauri
# from one platform to another isn't practical — each needs its own webview +
# linker. Coverage: macOS as one universal app for Apple Silicon and Intel
# (#509), built on the Apple Silicon runner, which compiles both halves;
# Windows and Linux on both ARM64 and x86-64. All of these runners are free for
# public repos.
#
# Run it manually from the Actions tab (workflow_dispatch), or push a `v*` tag
# to also attach the bundles to a GitHub Release. Bundles are always uploaded as
# downloadable artifacts on the run.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # only used by the tag-triggered release step

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15, pinned (#508): macos-14 is retired on 2026-11-02, and
          # macos-latest would move to a new image without a commit saying so.
          # One universal app (#509): the Apple Silicon runner builds the Intel
          # half too, so Intel Macs need no runner of their own.
          - name: macos-universal
            runner: macos-15
            bundles: dmg
            target: universal-apple-darwin
          # ARM64
          - name: windows-arm64
            runner: windows-11-arm
            bundles: nsis
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            bundles: deb,rpm
          # x86-64
          - name: windows-x64
            runner: windows-latest
            bundles: nsis
          - name: linux-x64
            runner: ubuntu-22.04
            bundles: deb,rpm
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The universal macOS app needs the Intel half's standard library too.
      - name: Add the Intel macOS target
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Same GTK/WebKit/audio system libraries the Linux CI build needs; the
      # runner doesn't ship them.
      - name: Install Tauri Linux system dependencies
        if: startsWith(matrix.name, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the app bundle
        run: cargo tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Upload bundles as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tagrex-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm

      # The release page's text is the changelog's own section for this version
      # (#261). The file already says what changed, in the words it was written
      # in; without this the most visible page in the project is a list of files
      # and nothing else. `shell: bash` because this runs on the Windows runners
      # too, where the default shell is PowerShell.
      - name: Take the release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          # A version with no section says so, rather than the page silently
          # going out empty again.
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See CHANGELOG.md for what changed in $version." > RELEASE_NOTES.md
          fi

      # On a version tag, also attach the bundles to the GitHub Release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
