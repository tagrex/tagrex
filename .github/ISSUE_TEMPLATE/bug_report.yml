name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: TagRex version
      description: Shown in the About dialog.
      placeholder: "0.20.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Audio format
      description: The file type involved, if the bug is about particular files.
      placeholder: "MP3 (ID3v2.3), FLAC, AIFF, ..."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a folder with ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened instead
    validations:
      required: true
