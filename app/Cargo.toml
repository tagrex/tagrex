[package]
name = "tagrex"
description = "Cross-platform audio tag editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# The GUI shell's own minimum is Tauri 2's 1.82, which the workspace's 1.89 now
# covers — the tag backend asks for more than the shell does (#201).
rust-version.workspace = true
publish = false

[dependencies]
tagrex-core.workspace = true
# The command layer (#272). It used to be this crate's own src/lib.rs; it moved
# out so the native shells can call it without linking the webview stack.
tagrex-commands = { path = "../crates/commands" }
# The preview player and waveform decoder (#296). Moved out of this crate so the
# native shells can drive playback; the rodio audio backend rides with it.
tagrex-player = { path = "../crates/player" }
tagrex-providers-beatport = { path = "../crates/providers-beatport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tauri = { version = "2", features = [] }
# Native folder chooser behind the "Browse…" button; the scanner then recurses
# into the picked folder. The JS side calls it via window.__TAURI__.dialog.
tauri-plugin-dialog = "2"
# Clipboard read for the custom edit context menu's Paste (#132). Reading via
# navigator.clipboard.readText() makes WKWebView pop a system "Paste"
# permission pill; the plugin reads it natively, no pill.
tauri-plugin-clipboard-manager = "2"
# Open a provider release page in the system browser (#92). Cross-platform
# (`open`/`start`/`xdg-open`); the URL is built + validated in main.rs so only
# Discogs/MusicBrainz release pages can ever be opened.
open = "5"
# Move files to the system Trash from the file table's context menu (#213).
# Cross-platform (Finder's trash, the Windows recycle bin, the freedesktop
# trash spec). `default-features = false` drops the `chrono` timestamp reader,
# which only matters for *listing* what is already in the trash — something
# nothing here does. It also drops the COM apartment mode, which is not
# optional: on Windows the crate fails to compile unless one is named (#222),
# so the default one is asked for by name. Inert on the other platforms.
trash = { version = "5.2.6", default-features = false, features = [
    "coinit_apartmentthreaded",
] }

# A second launch hands its folder to the window that is already open instead of
# starting another copy (#51). Windows and Linux only: on macOS the OS does this
# itself — a second `open` of the bundle goes to the running instance as the
# same Apple Event a double-click sends, which is what `RunEvent::Opened`
# receives.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# GUI shell: main.rs is the Tauri entry point (commands forward to the App
# command layer in lib.rs); the frontend is static HTML/CSS/JS under ui/.
# Run with `cargo run -p tagrex`; bundle a .app with `cargo tauri build`.
