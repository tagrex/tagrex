[package]
name = "tagrex"
description = "Cross-platform audio tag editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# The GUI shell's own minimum is Tauri 2's 1.82, which the workspace's 1.89 now
# covers — the tag backend asks for more than the shell does (#201).
rust-version.workspace = true
publish = false

[dependencies]
tagrex-core.workspace = true
tagrex-providers-discogs = { path = "../crates/providers-discogs" }
tagrex-providers-musicbrainz = { path = "../crates/providers-musicbrainz" }
tagrex-providers-beatport = { path = "../crates/providers-beatport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tauri = { version = "2", features = [] }
# Native folder chooser behind the "Browse…" button; the scanner then recurses
# into the picked folder. The JS side calls it via window.__TAURI__.dialog.
tauri-plugin-dialog = "2"
# Clipboard read for the custom edit context menu's Paste (#132). Reading via
# navigator.clipboard.readText() makes WKWebView pop a system "Paste"
# permission pill; the plugin reads it natively, no pill.
tauri-plugin-clipboard-manager = "2"
base64 = "0.22.1"
# Native audio backend for the preview player: a rodio Sink queues tracks
# back-to-back for gapless playback, decoding every format we handle (incl. OGG)
# via Symphonia. Linux needs libasound2-dev (see CI).
# 0.22 for a seek bar that seeks: before it, FLAC decoded through claxon, which
# has no seek support at all, and the Symphonia route couldn't seek either
# because the decoder was never told the file's length (#190). Symphonia handles
# every format here, which is where seek support lives; `recording` and the
# dither noise generator are not ours to carry.
rodio = { version = "0.22", default-features = false, features = [
  "playback",
  "symphonia-all",
] }
# Open a provider release page in the system browser (#92). Cross-platform
# (`open`/`start`/`xdg-open`); the URL is built + validated in main.rs so only
# Discogs/MusicBrainz release pages can ever be opened.
open = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# GUI shell: main.rs is the Tauri entry point (commands forward to the App
# command layer in lib.rs); the frontend is static HTML/CSS/JS under ui/.
# Run with `cargo run -p tagrex`; bundle a .app with `cargo tauri build`.
