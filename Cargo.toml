[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/providers-discogs",
    "crates/providers-musicbrainz",
    "crates/providers-beatport",
    "app",
]

[workspace.package]
version = "0.5.3"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/tagrex/tagrex"
# Verified minimum toolchain. Bumping edition to 2024 requires rust-version >= 1.85.
rust-version = "1.75"

[workspace.dependencies]
thiserror = "1"
tagrex-core = { path = "crates/core" }
