[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/providers-discogs",
    "crates/providers-musicbrainz",
    "crates/providers-beatport",
    "app",
]

[workspace.package]
version = "0.11.1"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/tagrex/tagrex"
# Verified minimum toolchain. Set by the tag backend, which requires 1.89 as of
# its 0.25 release (#201) — the core crates cannot ask for less than what they
# are built on. Bumping edition to 2024 requires rust-version >= 1.85.
rust-version = "1.89"

[workspace.dependencies]
thiserror = "1"
tagrex-core = { path = "crates/core" }

# Dependencies are optimised even in a debug build — our own crates are not, so
# they stay debuggable and quick to rebuild. Audio decoding is why (#101): a
# waveform for a six-minute track took 26 s unoptimised against 0.5 s optimised,
# and the debug bundle is what gets run all day. Dependencies compile once, so
# the cost is one slower first build.
[profile.dev.package."*"]
opt-level = 2
