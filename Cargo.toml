[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/commands",
    "crates/player",
    "crates/providers-discogs",
    "crates/providers-musicbrainz",
    "crates/providers-beatport",
    "crates/providers-bandcamp",
    "crates/providers-soundeo",
    "app",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/tagrex/tagrex"
# Verified minimum toolchain. Set by Tauri, which requires 1.90 (#512); the tag
# backend alone would need 1.89 as of its 0.25 release (#201), but no crate here
# is published, so one number for the whole workspace is the honest one. Check a
# change with `cargo +<version> build --workspace` before writing it down.
# Bumping edition to 2024 requires rust-version >= 1.85.
rust-version = "1.90"

[workspace.dependencies]
thiserror = "2"
tagrex-core = { path = "crates/core" }

# Dependencies are optimised even in a debug build — our own crates are not, so
# they stay debuggable and quick to rebuild. Audio decoding is why (#101): a
# waveform for a six-minute track took 26 s unoptimised against 0.5 s optimised,
# and the debug bundle is what gets run all day. Dependencies compile once, so
# the cost is one slower first build.
[profile.dev.package."*"]
opt-level = 2
