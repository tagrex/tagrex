[package]
name = "tagrex-ffi"
description = "C ABI over the TagRex core, for the native shell spikes (read-only)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "tagrex_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# The command layer (#293). The bridge dispatches into App rather than
# reimplementing a slice of the core, so a shell reaches the same surface the
# desktop app does. tagrex-core is still needed for the path types the DTOs use.
tagrex-commands = { path = "../commands" }
# The preview player (#297). Linking the bridge links the audio backend, which
# is the right trade for a shell that plays audio.
tagrex-player = { path = "../player" }
tagrex-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
