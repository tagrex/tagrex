[package]
name = "tagrex-player"
description = "The TagRex preview player: a rodio Sink on its own thread, plus the waveform and tempo analysis of the decoded audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tagrex-core.workspace = true
serde = { version = "1", features = ["derive"] }
# Native audio backend for the preview player: a rodio Sink queues tracks
# back-to-back for gapless playback, decoding every format we handle (incl. OGG)
# via Symphonia. Linux needs libasound2-dev (see CI).
# 0.22 for a seek bar that seeks: before it, FLAC decoded through claxon, which
# has no seek support at all, and the Symphonia route couldn't seek either
# because the decoder was never told the file's length (#190). Symphonia handles
# every format here, which is where seek support lives; `recording` and the
# dither noise generator are not ours to carry. 0.23 changes only the audio I/O
# layer underneath (cpal 0.18) and its error types (#511).
rodio = { version = "0.23", default-features = false, features = [
  "playback",
  "symphonia-all",
] }
# BPM detection (#536): a neural beat tracker on the pure-Rust `rten` ONNX
# runtime, so no native library has to build on any of the release targets.
# Without its default features, which are a CLI and a decoder of its own: the
# audio comes through the same rodio/Symphonia path as playback. `rten` itself
# only to load the embedded models from bytes, which the crate's own runtime
# cannot do (it loads from a path), and `anyhow` because its model trait says so.
beat-this = { version = "1.1", default-features = false }
rten = "0.24"
rten-tensor = "0.24"
anyhow = "1"
