[package]
name = "tagrex-core"
description = "TagRex core: tag model, bidirectional masks, transforms, transactional change pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Cover art resize/recompress (#41). Only the two cover formats we handle, to
# keep the dependency and build lean.
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png"] }
# Reads the legacy code pages of ID3v2 text the tag backend refuses (#686).
# Already in the tree via the player's decoder.
encoding_rs = "0.8.42"
# Reads a Retry-After stated as a date (#703), in the three forms HTTP allows.
# No dependencies of its own.
httpdate = "1.0.3"
# FileLike::splice (0.25.4, still so in 0.25.5) cuts a file to the wrong length
# when a shrinking edit ends at EOF (lofty-rs#731). Only a file with no audio after its tags can
# hit that, and model.rs refuses to write such a file before lofty sees it
# (`ensure_audio_after_tags`, #416).
# `tests/lofty_canaries.rs` (#671) runs with every `cargo test` and fails on an
# upgrade where lofty stops dropping the frames `splice_v23_frames` puts back
# on a 2.3 write (#667), which would then be written twice, or stops deleting
# the full-date TYER `lost_v23_year` recovers (#668). Its message names what to
# remove.
# 0.25.5 reads a CHAP or CTOC frame inside another one by recursing, which
# overflows the stack on a file of a few KB (lofty-rs#784, fixed on master,
# unreleased); `ensure_no_nested_chapter_frames` (#859) refuses such a file.
# Drop it once a release handles it.
lofty = "0.25.5"
regex = "1.13.1"
# Reads an oversized PNG cover row by row, so shrinking it never holds the full
# decoded image (#622). Already in the tree via image.
png = "0.18.1"
# 0.41 for its bundled SQLite 3.54.1 (RUSTSEC-2026-0459, #728).
rusqlite = { version = "0.42.0", features = ["bundled"] }
# Tells a case-only rename of one file from a move onto another file on a
# case-insensitive file system (#604, #605). Already in the tree via walkdir.
same-file = "1.0.6"
thiserror.workspace = true
walkdir = "2.5.0"
