[package]
name = "tagrex-commands"
description = "The TagRex command layer: one App object over the core, with no GUI dependency"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tagrex-core.workspace = true
tagrex-providers-discogs = { path = "../providers-discogs" }
tagrex-providers-musicbrainz = { path = "../providers-musicbrainz" }
tagrex-providers-beatport = { path = "../providers-beatport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
base64 = "0.22.1"
# Move files to the system Trash (#213). Cross-platform (Finder's trash, the
# Windows recycle bin, the freedesktop trash spec). `default-features = false`
# drops the `chrono` timestamp reader, which only matters for *listing* what is
# already in the trash — something nothing here does. It also drops the COM
# apartment mode, which is not optional: on Windows the crate fails to compile
# unless one is named (#222), so the default one is asked for by name. Inert on
# the other platforms.
trash = { version = "5.2.6", default-features = false, features = [
    "coinit_apartmentthreaded",
] }
